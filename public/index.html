<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Radar: add papers</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header class="hero">
    <div class="blooms" aria-hidden="true">🌸🌼🌺🌻🌷</div>
    <h1>Add papers</h1>
    <p class="lead">Upload a past paper or paste its text, give it a year, and it joins the analysis.</p>
    <nav class="nav"><a href="/dashboard.html">See the dashboard</a></nav>
  </header>

  <h2>Option A: upload a PDF</h2><br>
  <input type="file" id="file" accept="application/pdf">
  <button class="b" id="uploadBtn" style="margin-top:10px">Read PDF</button>

  <h2>Option B: paste the text</h2><br>
  <textarea id="paper" rows="10" placeholder="1. Define entrepreneurship. (5 marks)"></textarea>
  <button class="b g" id="splitBtn" style="margin-top:10px">Preview questions</button>
  <br>
  <input class="yr" id="year" placeholder="Year e.g. 2024">
  <button class="b" id="addBtn">Add paper to analysis</button>

  <pre id="out"></pre>
</main>
<script>
const $=id=>document.getElementById(id), out=$('out'), paper=$('paper');
const post=(url,body)=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());

$('uploadBtn').onclick=async()=>{
  const f=$('file').files[0];
  if(!f) return alert('Pick a PDF first');
  const fd=new FormData();fd.append('paper',f);
  const d=await fetch('/upload',{method:'POST',body:fd}).then(r=>r.json());
  if(d.error){out.textContent=d.error;return}
  paper.value=d.text;
  out.textContent=`Read ${d.pages} pages. Check the text above, then add it with a year.`;
};
$('splitBtn').onclick=async()=>{
  const d=await post('/split',{text:paper.value});
  out.textContent=d.questions.map(q=>`Q${q.number} [${q.marks} marks] - ${q.topics.join(', ')}\n${q.text}`).join('\n\n')||'No numbered questions found.';
};
$('addBtn').onclick=async()=>{
  const y=$('year').value.trim();
  if(!y||!paper.value.trim()) return alert('Add the paper text and a year');
  const d=await post('/papers',{year:y,text:paper.value});
  out.textContent=`Added ${y} (${d.questionCount} questions). Papers so far: ${d.totalPapers}`;
};
</script>
</body>
</html>
