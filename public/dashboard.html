<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Radar</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header class="hero">
    <div class="blooms" aria-hidden="true">🌸🌼🌺🌻🌷</div>
    <h1>Exam Radar</h1>
    <p class="lead">See which topics keep getting asked, then practice the real questions.</p>
    <nav class="nav"><a href="/index.html">Add papers</a><a href="/export">Export JSON</a></nav>
  </header>
  <h2>Hot topics</h2>
  <p class="note" id="sub">Loading...</p>
  <div id="view"></div>
</main>
<script>
const $=id=>document.getElementById(id), view=$('view'), sub=$('sub');
const COLORS=['#e11d74','#ea580c','#2563eb','#7c3aed','#0d9488'];
let papers=[];

async function topics(){
  const st=await fetch('/stats').then(r=>r.json());
  papers=await fetch('/papers').then(r=>r.json());
  view.innerHTML='';
  if(!st.totalPapers){sub.textContent='No papers yet. Add some on the Add papers page.';return}
  sub.textContent=`Based on ${st.totalPapers} past paper${st.totalPapers===1?'':'s'}. Tap a topic to practice.`;
  st.topics.forEach((t,i)=>{
    const pct=Math.round(t.papersCount/st.totalPapers*100);
    const c=document.createElement('button');
    c.className='card';c.style.setProperty('--c',COLORS[i%5]);
    c.innerHTML=`<div class="top"><span>${t.topic}</span><span class="pct">${pct}%</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="meta">Asked in ${t.papersCount} of ${st.totalPapers} papers, ${t.totalMarks} marks in total</div>`;
    c.onclick=()=>topic(t.topic);
    view.appendChild(c);
  });
}
function qsFor(name){
  const l=[];
  papers.forEach(p=>p.questions.forEach(q=>{if(q.topics.includes(name))l.push({year:p.year,...q})}));
  return l.sort((a,b)=>b.year-a.year);
}
function qBox(q){
  const d=document.createElement('div');d.className='q';
  const s=document.createElement('small');s.textContent=`${q.year}, ${q.marks} marks`;
  d.append(s,q.text);return d;
}
function topic(name){
  const l=qsFor(name);
  sub.textContent=`${name}: ${l.length} past question${l.length===1?'':'s'}`;
  view.innerHTML='<button class="b g" id="back">Back to topics</button><button class="b" id="prac">Practice these</button>';
  $('back').onclick=topics;$('prac').onclick=()=>practice(name,l,0);
  l.forEach(q=>view.appendChild(qBox(q)));
}
function practice(name,l,i){
  sub.textContent=`Practice, ${name}: question ${i+1} of ${l.length}`;
  view.innerHTML='<button class="b g" id="back">Back</button>';
  $('back').onclick=()=>topic(name);
  view.appendChild(qBox(l[i]));
  if(i+1<l.length){const n=document.createElement('button');n.className='b';n.textContent='Next question';n.onclick=()=>practice(name,l,i+1);view.appendChild(n)}
}
topics();
</script>
</body>
</html>
